[package]
name = "ninesixteen"
version = "0.1.2"
description = "ninesixteen.video desktop recorder & live streamer"
authors = ["ninesixteen.video"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ninesixteen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
ctr = "0.9"
chrono = { version = "0.4", features = ["clock"] }
dirs = "5"
parking_lot = "0.12"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"
windows-capture = { path = "../../../third_party/windows-capture" }
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_WinRT_Direct3D11",
    "Win32_Devices_HumanInterfaceDevice",
] }
rml_rtmp = "0.8"
bytes = "1"
url = "2"
libloading = "0.8.9"

# Optimize our own crate even in dev builds so the real-time pixel scaler keeps
# up at 60fps under `tauri dev`. Disable incremental here — mixing opt-level 3
# with unoptimized Tauri deps otherwise causes sporadic MSVC LNK2019 link failures.
[profile.dev.package.ninesixteen]
opt-level = 3
incremental = false

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
