name: Desktop release

# Push a tag like `desktop-v0.1.1` to build a signed Windows installer
# and publish updater artifacts to GitHub Releases.
on:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled binaries
        run: |
          node scripts/fetch-ffmpeg.mjs
          node scripts/fetch-softcam.mjs

      - name: Build & release desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_WEB_URL: https://ninesixteen.video
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: ninesixteen.video ${{ github.ref_name }}
          releaseBody: |
            **ninesixteen.video** — native 9×16 & 16×9 screen recorder for Windows.

            Record your screen in true portrait or landscape aspect — no cropping in post. Cursor-driven framing, Alt + scroll zoom, Game mode, system + mic audio, encrypted local recordings. Free to try; **$49 one-time** Pro export.

            ### v1.2.3 highlights
            - Recording stutter fix — viewport-glide disabled; WGC-only viewport updates at 60fps
            - Game mode — hide cursor and click-audio options in Studio; MF GPU encode path
            - Capture health recovery with GPU flush, grace period, and publish-miss diagnostics
            - Larger WGC frame pool (5 buffers)

            ### Install
            - **New installs:** download the NSIS `.exe` or `.msi` installer below.
            - **Existing installs:** the app checks GitHub on startup and offers a one-click update.

            **Website:** https://ninesixteen.video · **FAQ:** https://ninesixteen.video/faq · **Changelog:** https://ninesixteen.video/changelog

            Maintainer notes: [UPDATEGUIDE.md](https://github.com/ninesixteenvideo/ninesixteen/blob/master/UPDATEGUIDE.md)
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc
